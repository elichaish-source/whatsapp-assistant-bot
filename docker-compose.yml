services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?חסר POSTGRES_PASSWORD ב-.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
      WAHA_URL: http://waha:3000
    depends_on:
      db:
        condition: service_healthy

  waha:
    # הגרסה תלויה בסוג המעבד של השרת: arm-... ל-Oracle (Arm), latest-... ל-x86
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:?חסר WAHA_IMAGE_TAG ב-.env}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?חסר WAHA_API_KEY ב-.env}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?חסר WAHA_DASHBOARD_PASSWORD ב-.env}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_START_SESSION: default
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-sessions:/app/.sessions
    # פתוח רק מהשרת עצמו (לסריקת QR דרך מנהרת SSH), לא מהאינטרנט
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?חסר DOMAIN ב-.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:?חסר DUCKDNS_SUBDOMAIN ב-.env}
      TOKEN: ${DUCKDNS_TOKEN:?חסר DUCKDNS_TOKEN ב-.env}
      TZ: Asia/Jerusalem

volumes:
  db-data:
  waha-sessions:
  caddy-data:
  caddy-config:
