<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- ‏viewport-fit=cover נדרש כדי ש-env(safe-area-inset-*) יחזיר ערכים במכשירים עם מגרעת -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ניהול לקוחות, פרויקטים ומשימות" />

    <!-- צבע סרגל המערכת באנדרואיד, לפי ערכת הנושא של המכשיר -->
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)" />

    <!-- התקנה למסך הבית -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- ‏iOS מתעלם מ-manifest, ולכן אותן הגדרות חוזרות כאן -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="העוזר" />

    <title>העוזר שלי</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
